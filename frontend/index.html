<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Трансляция</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <img src="assets/logo.png" class="logo">
    <div class="user-info" id="user-panel">
      <!-- Заполняется через JS -->
    </div>
  </div>

  <div class="main">
    <div class="video-box">
      <video controls autoplay>
        <source src="/static/sample.mp4" type="video/mp4">
      </video>
    </div>

    <div class="chat-box">
      <div class="chat-tabs">
        <button onclick="switchTab('chat')">Чат</button>
        <button onclick="switchTab('qa')">Вопрос-ответ</button>
      </div>
      <div id="chat-messages" class="chat-messages">
        <!-- Пример сообщений -->
        <div class="chat-message">
          <b>Елена</b><br>Привет, видно хорошо!
          <div class="likes">❤️ 2</div>
        </div>
        <div class="chat-message">
          <b>Иван</b><br>Когда будет перерыв?
          <div class="likes">❤️ 1</div>
        </div>
      </div>
      <div class="chat-input" id="chatInputArea">
        <!-- Заполняется через JS -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
